name: CH2 Deployment

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: maven

      - name: Create settings.xml
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>anypoint-exchange-v3</id>
                <username>~~~Client~~~</username>
                <password>${{ secrets.ANYPOINT_CLIENT_ID }}~?~${{ secrets.ANYPOINT_CLIENT_SECRET }}</password>
              </server>
            </servers>
          </settings>
          EOF

      # ✅ STEP 1 — Publish to Exchange
      - name: Publish to Exchange
        run: |
          mvn clean deploy \
          -DskipMuleDeploy \
          -s ~/.m2/settings.xml \
          -DskipTests

      # ⏳ IMPORTANT (avoid 404)
      - name: Wait for Exchange sync
        run: sleep 20

      # ✅ STEP 2 — Deploy to CloudHub 2.0
      - name: Deploy to CloudHub 2.0
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          mvn mule:deploy \
          -s ~/.m2/settings.xml \
          -DskipTests