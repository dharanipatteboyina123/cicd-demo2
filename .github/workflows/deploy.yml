name: CH2 Deployment

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: maven

      - name: Create Settings.xml
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>anypoint-exchange-v3</id>
                <username>~~~Client~~~</username>
                <password>${{ secrets.ANYPOINT_CLIENT_ID }}~?~${{ secrets.ANYPOINT_CLIENT_SECRET }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Deploy to CloudHub 2.0
        run: |
          mvn clean deploy \
          -DmuleDeploy \
          -Danypoint.organizationId=adb812a6-130a-4abc-bd34-753e180d3b3f \
          -Danypoint.clientId=${{ secrets.ANYPOINT_CLIENT_ID }} \
          -Danypoint.clientSecret=${{ secrets.ANYPOINT_CLIENT_SECRET }} \
          -s ~/.m2/settings.xml \
          -DskipTests